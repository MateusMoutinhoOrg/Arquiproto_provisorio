<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginScreen/required_fields</title>
    <link rel="stylesheet" href="../../Assets/css/app.css">
    <link rel="stylesheet" href="../../Lib/info-popup.css">
    <script src="../../Lib/info-popup.js"></script>
</head>

<body>
    <main class="auth">
        <div class="brand"><span class="brand-mark">W</span>Worklist</div>

        <div class="card auth-card">
            <h1>Log in</h1>
            <template data-info-popup>
                <p>Authentication of an existing user.</p>
                <p>Empty login form with an error, shown after submitting with an empty field.</p>
            </template>
            <p class="muted">Welcome back. Pick up where your team left off.</p>

            <p class="alert alert-error" role="alert">Enter your email and password.</p>

            <form id="login" class="form" novalidate autocomplete="off">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password">
                </div>

                <button class="btn btn-primary btn-block">Log in</button>
                <template data-info-popup>
                    <ul>
                        <li>if email or password is empty → LoginScreen/required_fields</li>
                        <li>if email is user@example.com and password is password123 → Home/initial</li>
                        <li>else → LoginScreen/invalid_credentials</li>
                    </ul>
                </template>
            </form>

            <a class="auth-link" href="../ForgotPassword/initial.html">Forgot password?</a>
            <template data-info-popup><p>→ ForgotPassword/initial</p></template>
        </div>

        <p class="auth-foot">New to Worklist? <a href="../CreateAccount/initial.html">Create account</a><template data-info-popup><p>→ CreateAccount/initial</p></template></p>

        <p class="demo-hint">Demo login: user@example.com / password123</p>
    </main>

    <script src="../../Assets/js/app.js"></script>
    <script src="../../Assets/js/LoginScreen.js"></script>
</body>

</html>
