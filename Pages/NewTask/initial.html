<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewTask/initial</title>
    <link rel="stylesheet" href="../../Assets/css/app.css">
    <link rel="stylesheet" href="../../Assets/css/info-popup.css">
    <script src="../../Assets/js/info-popup.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">W</span>Worklist</div>
            <nav class="nav">
                <a class="nav-link nav-home" href="../Home/initial.html">Home</a>
                <template data-info-popup><p>→ Home/initial</p></template>
                <a class="nav-link nav-tasks" href="../Tasks/initial.html" aria-current="page">Tasks</a>
                <template data-info-popup><p>→ Tasks/initial</p></template>
                <a class="nav-link nav-projects" href="../Projects/initial.html">Projects</a>
                <template data-info-popup><p>→ Projects/initial</p></template>
                <a class="nav-link nav-settings" href="../SettingsProfile/initial.html">Settings</a>
                <template data-info-popup><p>→ SettingsProfile/initial</p></template>
            </nav>
            <div class="sidebar-user">
                <span class="avatar">ST</span>
                <span class="sidebar-user-text"><strong>Sam Taylor</strong><small>user@example.com</small></span>
            </div>
            <a class="nav-link nav-logout" href="../LoginScreen/initial.html">Log out</a>
            <template data-info-popup><p>→ LoginScreen/initial</p></template>
        </aside>

        <main class="main">
            <a class="back-link" href="../Tasks/initial.html">All tasks</a>
            <template data-info-popup><p>→ Tasks/initial</p></template>

            <div class="page-head">
                <div>
                    <h1>New task</h1>
                    <template data-info-popup>
                        <p>Creation of a task.</p>
                        <p>Empty task form, shown after choosing new task.</p>
                    </template>
                    <p class="muted">Add it to a project and set when it's due.</p>
                </div>
            </div>

            <form id="task" class="card form form-card" novalidate autocomplete="off">
                <div class="field">
                    <label for="title">Title</label>
                    <input id="title" name="title" type="text" placeholder="What needs to be done?">
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="project">Project</label>
                        <select id="project" name="project">
                            <option>Website relaunch</option>
                            <option>Mobile app</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option>High</option>
                            <option selected>Medium</option>
                            <option>Low</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="due">Due date</label>
                    <input id="due" name="due" type="date">
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary">Create task</button>
                    <template data-info-popup>
                        <ul>
                            <li>if title is empty → NewTask/title_required</li>
                            <li>else → Tasks/task_created</li>
                        </ul>
                    </template>
                    <a class="btn" href="../Tasks/initial.html">Cancel</a>
                    <template data-info-popup><p>→ Tasks/initial</p></template>
                </div>
            </form>
        </main>
    </div>

    <script src="../../Assets/js/app.js"></script>
    <script src="../../Assets/js/NewTask.js"></script>
</body>

</html>
