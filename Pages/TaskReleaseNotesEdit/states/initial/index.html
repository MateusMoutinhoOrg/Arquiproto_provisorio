<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskReleaseNotesEdit/initial</title>
    <link rel="stylesheet" href="../../../../Assets/css/app.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">W</span>Worklist</div>
            <nav class="nav">
                <a class="nav-link nav-home" href="../../../Home/states/initial/index.html">Home</a>
                <a class="nav-link nav-tasks" href="../../../Tasks/states/initial/index.html" aria-current="page">Tasks</a>
                <a class="nav-link nav-projects" href="../../../Projects/states/initial/index.html">Projects</a>
                <a class="nav-link nav-settings" href="../../../SettingsProfile/states/initial/index.html">Settings</a>
            </nav>
            <div class="sidebar-user">
                <span class="avatar">ST</span>
                <span class="sidebar-user-text"><strong>Sam Taylor</strong><small>user@example.com</small></span>
            </div>
            <a class="nav-link nav-logout" href="../../../LoginScreen/states/initial/index.html">Log out</a>
        </aside>

        <main class="main">
            <a class="back-link" href="../../../TaskReleaseNotes/states/initial/index.html">Back to task</a>

            <div class="page-head">
                <div>
                    <h1>Edit task</h1>
                </div>
            </div>

            <form id="edit" class="card form form-card" novalidate autocomplete="off">
                <div class="field">
                    <label for="title">Title</label>
                    <input id="title" name="title" type="text" value="Write release notes" placeholder="What needs to be done?">
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" name="description">Summarize what changed in the relaunch for customers and the support team.</textarea>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="project">Project</label>
                        <select id="project" name="project">
                            <option selected>Website relaunch</option>
                            <option>Mobile app</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option>High</option>
                            <option selected>Medium</option>
                            <option>Low</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="due">Due date</label>
                    <input id="due" name="due" type="date" value="2026-11-05">
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary">Save changes</button>
                    <a class="btn" href="../../../TaskReleaseNotes/states/initial/index.html">Cancel</a>
                </div>
            </form>
        </main>
    </div>

    <script src="../../../../Assets/js/app.js"></script>
    <script src="../../../../Assets/js/TaskReleaseNotesEdit.js"></script>
</body>

</html>
