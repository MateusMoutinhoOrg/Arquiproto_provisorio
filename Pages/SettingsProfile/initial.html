<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SettingsProfile/initial</title>
    <link rel="stylesheet" href="../../Assets/css/app.css">
    <link rel="stylesheet" href="../../Lib/info-popup.css">
    <script src="../../Lib/info-popup.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">W</span>Worklist</div>
            <nav class="nav">
                <a class="nav-link nav-home" href="../Home/initial.html">Home</a>
                <template data-info-popup><p>→ Home/initial</p></template>
                <a class="nav-link nav-tasks" href="../Tasks/initial.html">Tasks</a>
                <template data-info-popup><p>→ Tasks/initial</p></template>
                <a class="nav-link nav-projects" href="../Projects/initial.html">Projects</a>
                <template data-info-popup><p>→ Projects/initial</p></template>
                <a class="nav-link nav-settings" href="../SettingsProfile/initial.html" aria-current="page">Settings</a>
                <template data-info-popup><p>→ SettingsProfile/initial</p></template>
            </nav>
            <div class="sidebar-user">
                <span class="avatar">ST</span>
                <span class="sidebar-user-text"><strong>Sam Taylor</strong><small>user@example.com</small></span>
            </div>
            <a class="nav-link nav-logout" href="../LoginScreen/initial.html">Log out</a>
            <template data-info-popup><p>→ LoginScreen/initial</p></template>
        </aside>

        <main class="main">
            <div class="page-head">
                <div>
                    <h1>Settings</h1>
                    <template data-info-popup>
                        <p>Edition of the user's profile.</p>
                        <p>Form filled with the user's fixed profile, shown after choosing settings or the profile tab.</p>
                    </template>
                    <p class="muted">Manage your account and preferences.</p>
                </div>
            </div>

            <nav class="tabs page-tabs" aria-label="Settings sections">
                <a class="tab" href="../SettingsProfile/initial.html" aria-current="page">Profile</a>
                <template data-info-popup><p>→ SettingsProfile/initial</p></template>
                <a class="tab" href="../SettingsNotifications/initial.html">Notifications</a>
                <template data-info-popup><p>→ SettingsNotifications/initial</p></template>
                <a class="tab" href="../SettingsSecurity/initial.html">Security</a>
                <template data-info-popup><p>→ SettingsSecurity/initial</p></template>
            </nav>

            <form id="profile" class="card form form-card" novalidate autocomplete="off">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" value="Sam Taylor">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="user@example.com">
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary">Save changes</button>
                    <template data-info-popup><p>→ SettingsProfile/saved</p></template>
                </div>
            </form>
        </main>
    </div>

    <script src="../../Assets/js/app.js"></script>
    <script src="../../Assets/js/SettingsProfile.js"></script>
</body>

</html>
