<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SettingsProfile/saved</title>
    <link rel="stylesheet" href="../../../../Assets/css/app.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">W</span>Worklist</div>
            <nav class="nav">
                <a class="nav-link nav-home" href="../../../Home/states/initial/index.html">Home</a>
                <a class="nav-link nav-tasks" href="../../../Tasks/states/initial/index.html">Tasks</a>
                <a class="nav-link nav-projects" href="../../../Projects/states/initial/index.html">Projects</a>
                <a class="nav-link nav-settings" href="../../../SettingsProfile/states/initial/index.html" aria-current="page">Settings</a>
            </nav>
            <div class="sidebar-user">
                <span class="avatar">ST</span>
                <span class="sidebar-user-text"><strong>Sam Taylor</strong><small>user@example.com</small></span>
            </div>
            <a class="nav-link nav-logout" href="../../../LoginScreen/states/initial/index.html">Log out</a>
        </aside>

        <main class="main">
            <div class="page-head">
                <div>
                    <h1>Settings</h1>
                    <p class="muted">Manage your account and preferences.</p>
                </div>
            </div>

            <nav class="tabs page-tabs" aria-label="Settings sections">
                <a class="tab" href="../../../SettingsProfile/states/initial/index.html" aria-current="page">Profile</a>
                <a class="tab" href="../../../SettingsNotifications/states/initial/index.html">Notifications</a>
                <a class="tab" href="../../../SettingsSecurity/states/initial/index.html">Security</a>
            </nav>

            <p class="alert alert-success" role="status">Profile saved.</p>

            <form id="profile" class="card form form-card" novalidate autocomplete="off">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" value="Sam Taylor">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="user@example.com">
                </div>

                <div class="form-actions"><button class="btn btn-primary">Save changes</button></div>
            </form>
        </main>
    </div>

    <script src="../../../../Assets/js/app.js"></script>
    <script src="../../../../Assets/js/SettingsProfile.js"></script>
</body>

</html>
