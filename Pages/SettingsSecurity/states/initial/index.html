<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SettingsSecurity/initial</title>
    <link rel="stylesheet" href="../../../../Assets/css/app.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">W</span>Worklist</div>
            <nav class="nav">
                <a class="nav-link nav-home" href="../../../Home/states/initial/index.html">Home</a>
                <a class="nav-link nav-tasks" href="../../../Tasks/states/initial/index.html">Tasks</a>
                <a class="nav-link nav-projects" href="../../../Projects/states/initial/index.html">Projects</a>
                <a class="nav-link nav-settings" href="../../../SettingsProfile/states/initial/index.html" aria-current="page">Settings</a>
            </nav>
            <div class="sidebar-user">
                <span class="avatar">ST</span>
                <span class="sidebar-user-text"><strong>Sam Taylor</strong><small>user@example.com</small></span>
            </div>
            <a class="nav-link nav-logout" href="../../../LoginScreen/states/initial/index.html">Log out</a>
        </aside>

        <main class="main">
            <div class="page-head">
                <div>
                    <h1>Settings</h1>
                    <p class="muted">Manage your account and preferences.</p>
                </div>
            </div>

            <nav class="tabs page-tabs" aria-label="Settings sections">
                <a class="tab" href="../../../SettingsProfile/states/initial/index.html">Profile</a>
                <a class="tab" href="../../../SettingsNotifications/states/initial/index.html">Notifications</a>
                <a class="tab" href="../../../SettingsSecurity/states/initial/index.html" aria-current="page">Security</a>
            </nav>

            <form id="password-form" class="card form form-card" novalidate autocomplete="off">
                <div class="field">
                    <label for="password">New password</label>
                    <input id="password" name="password" type="password">
                </div>

                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input id="confirm" name="confirm" type="password">
                </div>

                <div class="form-actions"><button class="btn btn-primary">Change password</button></div>
            </form>

            <section class="card danger-zone">
                <div>
                    <h2>Delete account</h2>
                    <p class="muted small">Your tasks and projects will be removed.</p>
                </div>
                <a class="btn btn-danger-outline" href="../../../SettingsSecurity/states/delete_account/index.html">Delete account</a>
            </section>
        </main>
    </div>

    <script src="../../../../Assets/js/app.js"></script>
    <script src="../../../../Assets/js/SettingsSecurity.js"></script>
</body>

</html>
