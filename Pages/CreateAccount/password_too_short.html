<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateAccount/password_too_short</title>
    <link rel="stylesheet" href="../../Assets/css/app.css">
    <link rel="stylesheet" href="../../Assets/css/info-popup.css">
    <script src="../../Assets/js/info-popup.js"></script>
</head>

<body>
    <main class="auth">
        <div class="brand"><span class="brand-mark">W</span>Worklist</div>

        <div class="card auth-card">
            <h1>Create account</h1>
            <template data-info-popup>
                <p>Registration of a new user.</p>
                <p>Empty registration form with an error, shown after submitting with a short password.</p>
            </template>
            <p class="muted">Start organizing your team's work in minutes.</p>

            <p class="alert alert-error" role="alert">Use at least 8 characters for your password.</p>

            <form id="create" class="form" novalidate autocomplete="off">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password">
                </div>

                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input id="confirm" name="confirm" type="password">
                </div>

                <button class="btn btn-primary btn-block">Create account</button>
                <template data-info-popup>
                    <ul>
                        <li>if any field is empty → CreateAccount/required_fields</li>
                        <li>if email format is invalid → CreateAccount/invalid_email</li>
                        <li>if email is user@example.com → CreateAccount/email_already_exists</li>
                        <li>if password has fewer than 8 characters → CreateAccount/password_too_short</li>
                        <li>if password and confirmation differ → CreateAccount/password_mismatch</li>
                        <li>else → OnboardingWorkspace/initial</li>
                    </ul>
                </template>
            </form>
        </div>

        <p class="auth-foot">Already have an account? <a href="../LoginScreen/initial.html">Back to login</a><template data-info-popup><p>→ LoginScreen/initial</p></template></p>
    </main>

    <script src="../../Assets/js/app.js"></script>
    <script src="../../Assets/js/CreateAccount.js"></script>
</body>

</html>
