<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateAccount/required_fields</title>
    <link rel="stylesheet" href="../../../../Assets/css/app.css">
</head>

<body>
    <main class="auth">
        <div class="brand"><span class="brand-mark">W</span>Worklist</div>

        <div class="card auth-card">
            <h1>Create account</h1>
            <p class="muted">Start organizing your team's work in minutes.</p>

            <p class="alert alert-error" role="alert">Fill in all the fields.</p>

            <form id="create" class="form" novalidate autocomplete="off">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password">
                </div>

                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input id="confirm" name="confirm" type="password">
                </div>

                <button class="btn btn-primary btn-block">Create account</button>
            </form>
        </div>

        <p class="auth-foot">Already have an account? <a href="../../../LoginScreen/states/initial/index.html">Back to login</a></p>
    </main>

    <script src="../../../../Assets/js/app.js"></script>
    <script src="../../../../Assets/js/CreateAccount.js"></script>
</body>

</html>
