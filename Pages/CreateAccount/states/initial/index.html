<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateAccount/initial</title>
    <style>
        body { font-family: sans-serif; max-width: 320px; margin: 4rem auto; padding: 0 1rem; }
        input, button { display: block; width: 100%; box-sizing: border-box; margin-bottom: .5rem; padding: .5rem; }
    </style>
</head>

<body>
    <h1>Create account</h1>

    <form id="create" novalidate autocomplete="off">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button>Create</button>
    </form>

    <a href="../../../LoginScreen/states/initial/index.html">Back to login</a>

    <script>
        window.onpageshow = function () {
            document.getElementById("create").reset();
        };

        document.getElementById("create").onsubmit = function (event) {
            event.preventDefault();
            location.href = "../../../Home/states/initial/index.html";
        };
    </script>
</body>

</html>
