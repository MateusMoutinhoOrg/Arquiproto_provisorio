<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>ProjectMobile/initial</title>
    <link rel="stylesheet" href="../../../../Assets/css/app.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">W</span>Worklist</div>
            <nav class="nav">
                <a class="nav-link nav-home" href="../../../Home/states/initial/index.html">Home</a>
                <a class="nav-link nav-tasks" href="../../../Tasks/states/initial/index.html">Tasks</a>
                <a class="nav-link nav-projects" href="../../../Projects/states/initial/index.html" aria-current="page">Projects</a>

            <div class="sidebar-user">
                <span class="avatar">ST</span>
                <span class="sidebar-user-text"><strong>Sam Taylor</strong><small>user@example.com</small></span>
            </div>
            <a class="nav-link nav-logout" href="../../../LoginScreen/states/initial/index.html">Log out</a>
        </aside>

        <main class="main">

                    <p class="muted">Fixes and polish for the next store release.</p>

                    <div class="list">
                        <a class="task-row" href="../../../TaskCheckoutBug/states/initial/index.html">

                            <span class="task-main">
                                <span class="task-title">Fix checkout bug</span>
                                <span class="task-meta">Mobile app · High priority · Nov 3</span>
                            </span>
                            <span class="badge badge-overdue">Overdue</span>

                </section>
            </div>
