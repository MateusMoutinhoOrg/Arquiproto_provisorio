<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectMobile/initial</title>
    <link rel="stylesheet" href="../../Assets/css/app.css">
    <link rel="stylesheet" href="../../Lib/info-popup.css">
    <script src="../../Lib/info-popup.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">W</span>Worklist</div>
            <nav class="nav">
                <a class="nav-link nav-home" href="../Home/initial.html">Home</a>
                <template data-info-popup><p>→ Home/initial</p></template>
                <a class="nav-link nav-tasks" href="../Tasks/initial.html">Tasks</a>
                <template data-info-popup><p>→ Tasks/initial</p></template>
                <a class="nav-link nav-projects" href="../Projects/initial.html" aria-current="page">Projects</a>
                <template data-info-popup><p>→ Projects/initial</p></template>
                <a class="nav-link nav-settings" href="../SettingsProfile/initial.html">Settings</a>
                <template data-info-popup><p>→ SettingsProfile/initial</p></template>
            </nav>
            <div class="sidebar-user">
                <span class="avatar">ST</span>
                <span class="sidebar-user-text"><strong>Sam Taylor</strong><small>user@example.com</small></span>
            </div>
            <a class="nav-link nav-logout" href="../LoginScreen/initial.html">Log out</a>
            <template data-info-popup><p>→ LoginScreen/initial</p></template>
        </aside>

        <main class="main">
            <a class="back-link" href="../Projects/initial.html">All projects</a>
            <template data-info-popup><p>→ Projects/initial</p></template>

            <div class="page-head">
                <div>
                    <h1>Mobile app</h1>
                    <template data-info-popup>
                        <p>Details of the project "Mobile app".</p>
                        <p>The project's progress and tasks, shown after opening it.</p>
                    </template>
                    <p class="muted">Fixes and polish for the next store release.</p>
                </div>
                <a class="btn btn-primary" href="../NewTask/initial.html">New task</a>
                <template data-info-popup><p>→ NewTask/initial</p></template>
            </div>

            <div class="stack">
                <div class="card progress-card">
                    <div class="project-head"><h2>Progress</h2><span class="muted small">0 of 1 done</span></div>
                    <progress class="progress" value="0" max="1" aria-label="Mobile app progress"></progress>
                </div>

                <section>
                    <h2 class="section-title">Tasks</h2>
                    <div class="list">
                        <a class="task-row" href="../TaskCheckoutBug/initial.html">
                            <span class="status status-open" role="img" aria-label="Open"></span>
                            <span class="task-main">
                                <span class="task-title">Fix checkout bug</span>
                                <span class="task-meta">Mobile app · High priority · Nov 3</span>
                            </span>
                            <span class="badge badge-overdue">Overdue</span>
                        </a>
                        <template data-info-popup><p>→ TaskCheckoutBug/initial</p></template>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
